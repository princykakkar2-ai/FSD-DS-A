<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
    <style>
        p{
            color: aliceblue;
            margin-left: 15px;
        }
        h3{
            color: aliceblue;
            margin-left: 25px;
        }

        .modal{
            display: none;
            position: fixed;
            z-index: 1000;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: aliceblue;
        }

        .modal h2, .modal h3 { color: #333; margin-left: 0; }
        .modal p { color: #555; margin-left: 0;
        
            .close-btn {
            float: right;
            cursor: pointer;
            background: crimson;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
        }
        }
    </style>
</head>
<body>
    <div style="border: 2px solid aliceblue;width: 400px;height:600px;background-color:cadetblue">
            <div style="display: flex;flex-direction: row;gap: 20px;">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjkkFH9OngOJijy-ZrZYx8xW7QYIQrV1iGcB879kLQEw&s=10" alt="" style="height: 50px;width: 50px; border-radius: 50%;background-color: cadetblue; margin-top: 20px;margin-left: 20px;"/>
            <h1 style="color: aliceblue;">Bus Booking System</h1>
        </div>
        <hr style="color:aliceblue">
        <h3>User Information</h3>
        <p>User Name:<input type="text" id="name"/></p>
        <p>User Age:<input type="text"/></p>
        <p>Aadhar No:<input type="text"/></p>
        <p>Select Your City:<select name="id" id="city">
            <option>Goa</option>
            <option>Delhi</option>
            <option>Ghaziabad</option>
            <option>Mumbai</option>
            <option>Punjab</option>
        </select></p>
        <p>Select your travelling date:<input type="date"/></p>

        <h3>Bus Information</h3>
        <p>Select your bus type:</p>
        <P>All<input type="radio" id="al" name="ad" value="all"/></P>
        <P>Ac-Rs2000<input type="radio" id="al" name="ad" value="2000"/></P>
        <P>No-AC-Rs1500<input type="radio" id="al" name="ad" value="1500"/></P>
        <p>select your seat:<select name="seat" id="seat">
            <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        </select></p>

        <button style="color: black;margin-left: 20px;" onclick="event.preventDefault(); Final()">Submit</button>

        <div id="myModal" class="modal">
            <button class="close-btn" onclick="closeModal()">X</button>
            <div id="modalBody" class="modal-content">
                </div>
        </div>

        
    </div>

    <script>
        function Final(){
            const name=document.getElementById('name').value;
            const city_name=document.getElementById('city').value;
            const no_seat=parseInt(document.getElementById('seat').value)||0;
            const bus_type=document.querySelector('input[name="ad"]:checked');
            const cost=parseInt(bus_type.value)*no_seat;
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                    <h2>Ticket Confirmed!</h2>
                    <p>Welcome back, <strong>${name}</strong></p>
                    <p>Destination: <span style="color: crimson; font-weight: bold;">${city_name}</span></p>
                    <hr>
                    <h3>Total Cost: Rs. ${cost}</h3>
                `;
                document.getElementById('myModal').style.display = "block";


            alert(
                "Welcome "+name+"\n"+"Your Journey City:"+city_name+"\n"+"Cost is"+cost
            )
        }
                        function closeModal() {
                        document.getElementById('myModal').style.display = "none";
                        }
    </script>
</body>
</html>
