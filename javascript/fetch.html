<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <style>
        table {
            width: 80%;
            margin:auto;
            padding:10px;
            border:2px solid red;
        }

       
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>

    <script>
        const ele=document.getElementById("data");
        const url="https://dummyjson.com/products";
        
        async function loadData(){
            try{
                const res=await fetch(url);
                const data= await res.json();
                console.log(data.products);
                let row="";
                data.products.map((i,index) => {
                    row+=`<tr>
                        <td>${i.title}</td>
                        <td><img src="${i.thumbnail}" width="100px" height="100px"></td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                    </tr>`;
                }); 
                ele.innerHTML=row;
            }
            catch(error){
                console.log(error);
            }
        }
        loadData();
    </script>
</body>
</html>
