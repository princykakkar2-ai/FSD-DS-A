<body>
    <script>
        function isArmstrong(n){
    let sum=0;
    let temp=n;
    const nums=n.toString().length;
    while(n>0){
        let digit=n%10;
        sum+=Math.pow(digit,nums);
        n=Math.floor(n/10);
    }
    return temp==sum;

}
console.log(isArmstrong(153));
    </script>
    
</body>
